name: desktop

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: interval-windows
          - os: macos-latest
            artifact: interval-macos
          - os: ubuntu-latest
            artifact: interval-linux

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      # The Rust backend cannot be cross-compiled from one runner to another, which is
      # the whole reason this is a matrix rather than a single job.
      - name: Build backend
        run: cargo build --release -p interval-backend

      # `bun run build` is `tsc --noEmit && vite build`, so this type-checks too.
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Stage backend binary
        working-directory: desktop
        run: node scripts/prepack.js

      # macOS artifacts are intentionally unsigned: notarization needs an Apple
      # Developer ID. Without this, electron-builder fails looking for an identity.
      - name: Package
        working-directory: desktop
        run: bunx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
