[package]
name = "interval-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true

# Named `interval-desktop`, not `interval`, to stay distinct from the electron-era
# artifacts and any future CLI. Installers and menus still present the app as
# "interval" via packager metadata (added when packaging lands).
[[bin]]
name = "interval-desktop"
path = "src/main.rs"

[dependencies]
interval-backend = { path = "../backend" }
interval-desktop-core = { path = "../desktop-core" }

anyhow = "1"
chrono = "0.4"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to the same rev as ~/dev/echo because gpui_platform is not yet published to
# crates.io and gpui's API moves quickly. Bumping this rev is a deliberate task, not
# routine — re-check echo's gpui-cross-platform trap list when doing so.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a8cae3bd77f6e1c1dde98bb1dcebba0d254dbd71" }
# Every backend sits behind a feature and `default = []`, so these are not optional extras:
# without them Linux compiles cleanly to a binary with no windowing backend at all, which
# panics out of `current_platform()` before opening a window, and macOS substitutes
# NoopTextSystem and draws no text. Listed unconditionally, as zed itself does — each one
# resolves to a target-gated crate, so it is inert off its platform. Windows needs no flag.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a8cae3bd77f6e1c1dde98bb1dcebba0d254dbd71", features = [
    "wayland",
    "x11",
    "font-kit",
] }

[build-dependencies]
embed-resource = "3"
sha2 = "0.10"
