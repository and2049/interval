<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Interval</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .mark {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #a3a3a3;
      }
      .bar {
        position: relative;
        width: 12rem;
        height: 2px;
        overflow: hidden;
        background: #262626;
        border-radius: 999px;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: #e10600;
        animation: slide 1.1s ease-in-out infinite;
      }
      .hint {
        font-size: 0.8125rem;
        color: #737373;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark">Interval</div>
    <div class="bar"></div>
    <div class="hint">Starting&hellip;</div>
  </body>
</html>
